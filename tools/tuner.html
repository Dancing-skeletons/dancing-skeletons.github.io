<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Accordeur — ukulélé & guitare</title>
<style>
  :root { font-family: system-ui, -apple-system, sans-serif; background:#f4f6fa; color:#22314a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:1rem; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  .sub { font-size: .85rem; color:#6b7a93; margin:0 0 1rem; }

  .topbar {
    display:flex; flex-wrap:wrap; gap:.6rem; align-items:end;
    background:#fff; border:1px solid #e2e8f2; border-radius:10px; padding:.8rem;
    margin-bottom:1rem;
  }
  .field { display:flex; flex-direction:column; gap:.25rem; }
  .field label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#6b7a93; }
  .field select { font-size:.95rem; padding:.35rem; border:1px solid #cdd7e5; border-radius:6px; background:#fff; }
  button { font-size:1rem; font-weight:700; border:none; border-radius:7px; padding:.5rem 1rem; cursor:pointer; }
  #mic-btn { background:#00558d; color:#fff; }
  #mic-btn.on { background:#c0392b; }
  .status { font-size:.85rem; color:#6b7a93; align-self:center; min-height:1.2em; }
  .status.err { color:#c0392b; font-weight:700; }

  .section { background:#fff; border:1px solid #e2e8f2; border-radius:10px; padding:.8rem .9rem; margin-bottom:1rem; }
  .section > h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:#6b7a93; margin:0 0 .6rem; }

  /* Fixed-height readout: nothing moves when the signal drops */
  .readout { text-align:center; }
  .note {
    font-size:3.2rem; font-weight:800; line-height:1.1; min-height:3.6rem;
    font-family:ui-monospace,Menlo,monospace;
  }
  .note.ok { color:#0a7d33; }
  .readout-row { display:flex; justify-content:center; align-items:baseline; gap:1rem; flex-wrap:wrap; min-height:1.6rem; }
  .freq { font-size:1.1rem; font-weight:700; color:#6b7a93; font-family:ui-monospace,Menlo,monospace; }
  .cents { font-size:1.1rem; font-weight:700; font-family:ui-monospace,Menlo,monospace; }
  .cents.ok { color:#0a7d33; } .cents.close { color:#b8860b; } .cents.off { color:#c0392b; }
  .hint { font-size:.9rem; font-weight:700; color:#6b7a93; min-width:9rem; text-align:left; }

  /* One meter bar per string, always rendered (fixed layout) */
  .srow {
    display:grid; gap:.6rem; align-items:center; padding:.4rem .3rem; border-radius:8px;
    grid-template-areas: "name target meter dev";
    grid-template-columns: 3.4rem 5.6rem 1fr 8.5rem;
  }
  .srow.active { background:#eef2f7; }
  .sname {
    grid-area:name; font-weight:800; font-family:ui-monospace,Menlo,monospace; font-size:1.05rem;
    background:#f4f8fd; border:2px solid #cdd7e5; border-radius:8px; padding:.35rem 0; cursor:pointer;
  }
  .sname:hover { border-color:#00558d; }
  .starget { grid-area:target; font-size:.78rem; color:#6b7a93; font-family:ui-monospace,Menlo,monospace; }
  .sdev { grid-area:dev; font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:.85rem; text-align:right; min-height:1.2em; }

  .meter {
    grid-area:meter; position:relative; height:14px; border-radius:7px;
    background: linear-gradient(90deg,
      #e5a49e 0%, #e5a49e 30%,
      #f2d38b 30%, #f2d38b 40%,
      #a9d8b4 40%, #a9d8b4 60%,
      #f2d38b 60%, #f2d38b 70%,
      #e5a49e 70%, #e5a49e 100%);
  }
  .meter::after {
    content:""; position:absolute; left:50%; top:-2px; bottom:-2px; width:2px; margin-left:-1px;
    background:#22314a; border-radius:1px;
  }
  .marker {
    position:absolute; top:-4px; bottom:-4px; width:5px; margin-left:-2.5px; border-radius:3px;
    background:#c0392b; display:none;
  }
  .marker.on { display:block; }
  .marker.ok { background:#0a7d33; }
  .marker.close { background:#b8860b; }
  .srow.active .meter { outline:2px solid #00558d; outline-offset:1px; }

  .hintbar { font-size:.75rem; color:#6b7a93; margin:.6rem 0 0; text-align:center; }

  @media screen and (max-width: 640px) {
    .srow {
      grid-template-areas: "name target dev" "meter meter meter";
      grid-template-columns: 3.2rem 1fr 7rem;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Accordeur</h1>
  <p class="sub">Choisissez l'instrument, jouez une corde — cliquez sur une corde pour entendre sa note cible.</p>

  <div class="topbar">
    <div class="field">
      <label for="instrument">Instrument</label>
      <select id="instrument">
        <option value="uke">Ukulélé g aigu (G4 C4 E4 A4)</option>
        <option value="uke_lowg">Ukulélé G grave (G3 C4 E4 A4)</option>
        <option value="uke_baritone">Ukulélé baritone (D3 G3 B3 E4)</option>
        <option value="guitar">Guitare (E2 A2 D3 G3 B3 E4)</option>
      </select>
    </div>
    <div class="field">
      <label for="a4">Référence La</label>
      <select id="a4">
        <option value="440">440 Hz</option>
        <option value="432">432 Hz</option>
        <option value="442">442 Hz</option>
      </select>
    </div>
    <button id="mic-btn">Démarrer le micro</button>
    <span id="status" class="status">micro arrêté</span>
  </div>

  <div class="section readout">
    <div id="note" class="note">—</div>
    <div class="readout-row">
      <span id="freq" class="freq">— Hz</span>
      <span id="cents" class="cents">—</span>
      <span id="hint" class="hint"></span>
    </div>
  </div>

  <div class="section">
    <h2>Cordes</h2>
    <div id="strings"></div>
    <p class="hintbar">barre = écart en cents (±50) — vert ±5, orange ±20 — le marqueur est calé au bord si hors plage</p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

  // Strings listed from the string nearest your chin (4) to string 1, like pravin/Ukulele-Tuner
  var TUNINGS = {
    uke:          [ {midi:67}, {midi:60}, {midi:64}, {midi:69} ],  // G4 C4 E4 A4
    uke_lowg:     [ {midi:55}, {midi:60}, {midi:64}, {midi:69} ],  // G3 C4 E4 A4
    uke_baritone: [ {midi:50}, {midi:55}, {midi:59}, {midi:64} ],  // D3 G3 B3 E4
    guitar:       [ {midi:40}, {midi:45}, {midi:50}, {midi:55}, {midi:59}, {midi:64} ] // E2 A2 D3 G3 B3 E4
  };

  var GATE_ON = 0.012;   // RMS above this: signal present
  var GATE_OFF = 0.005;  // RMS below this for a while: signal lost
  var HANG_MS = 300;     // keep last reading this long during dropouts (no flicker)
  var SMOOTHING = 5;     // median over this many readings (pravin's SMOOTHING)
  var UI_MS = 100;       // min delay between DOM updates

  var els = {
    instrument: document.getElementById("instrument"),
    a4: document.getElementById("a4"),
    micBtn: document.getElementById("mic-btn"),
    status: document.getElementById("status"),
    note: document.getElementById("note"),
    freq: document.getElementById("freq"),
    cents: document.getElementById("cents"),
    hint: document.getElementById("hint"),
    strings: document.getElementById("strings")
  };

  var audioCtx = null;
  var analyser = null;
  var micStream = null;
  var running = false;
  var rafId = null;
  var scratch = null;
  var history = [];
  var lastSignalAt = 0;
  var lastUiAt = 0;
  var lastSig = null;

  function a4Ref() { return parseFloat(els.a4.value); }
  function midiToFreq(m) { return a4Ref() * Math.pow(2, (m - 69) / 12); }
  function freqToMidi(f) { return 69 + 12 * Math.log2(f / a4Ref()); }
  function noteName(midi) {
    var r = Math.round(midi);
    return NOTE_NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1);
  }
  function median(arr) {
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  /* ---------- Strings panel: one fixed meter bar per string ---------- */

  function buildStrings() {
    els.strings.innerHTML = "";
    TUNINGS[els.instrument.value].forEach(function (s) {
      var row = document.createElement("div");
      row.className = "srow";
      row.dataset.midi = s.midi;
      var f = midiToFreq(s.midi);
      row.innerHTML =
        '<button class="sname" title="écouter la note">' + noteName(s.midi) + "</button>" +
        '<span class="starget">' + f.toFixed(1) + " Hz</span>" +
        '<div class="meter"><div class="marker"></div></div>' +
        '<span class="sdev"></span>';
      row.querySelector(".sname").addEventListener("click", function () { playTone(f); });
      els.strings.appendChild(row);
    });
    history = [];
    lastSig = null;
    updateUI(null);
  }

  /* ---------- Reference tone (oscillator) ---------- */

  function playTone(freq) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    var t0 = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
    gain.gain.setValueAtTime(0.25, t0 + 1.2);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 1.6);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 1.7);
  }

  /* ---------- Pitch detection (normalized autocorrelation, MPM-style) ---------- */

  var MIN_FREQ = 60, MAX_FREQ = 1200;

  function detectPitch(buf, sampleRate) {
    var N = buf.length;
    var rms = 0;
    for (var i = 0; i < N; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / N);
    if (rms < GATE_OFF) return null;

    var minLag = Math.max(2, Math.floor(sampleRate / MAX_FREQ));
    var maxLag = Math.min(N - 1, Math.floor(sampleRate / MIN_FREQ));

    var nsdf = new Float32Array(maxLag + 1);
    for (var lag = minLag; lag <= maxLag; lag++) {
      var acf = 0, m0 = 0, m1 = 0;
      for (var j = 0; j < N - lag; j++) {
        acf += buf[j] * buf[j + lag];
        m0 += buf[j] * buf[j];
        m1 += buf[j + lag] * buf[j + lag];
      }
      var denom = m0 + m1;
      nsdf[lag] = denom > 0 ? (2 * acf) / denom : 0;
    }

    var globalMax = 0;
    for (var k = minLag; k <= maxLag; k++) if (nsdf[k] > globalMax) globalMax = nsdf[k];
    if (globalMax < 0.3) return null;

    // First local max above 85% of global max -> the fundamental, not a harmonic
    var bestLag = -1;
    for (var l = minLag + 1; l < maxLag; l++) {
      if (nsdf[l] >= 0.85 * globalMax && nsdf[l] > nsdf[l - 1] && nsdf[l] >= nsdf[l + 1]) {
        bestLag = l;
        break;
      }
    }
    if (bestLag < 0) {
      for (var l2 = minLag; l2 <= maxLag; l2++) if (nsdf[l2] === globalMax) { bestLag = l2; break; }
    }
    if (bestLag < 0) return null;

    var y0 = nsdf[bestLag - 1], y1 = nsdf[bestLag], y2 = nsdf[bestLag + 1];
    var denomP = y0 - 2 * y1 + y2;
    var shift = Math.abs(denomP) > 1e-12 ? 0.5 * (y0 - y2) / denomP : 0;

    return { freq: sampleRate / (bestLag + shift), rms: rms };
  }

  /* ---------- UI update (only when quantized values change) ---------- */

  function setStatus(msg, isErr) {
    els.status.textContent = msg;
    els.status.className = "status" + (isErr ? " err" : "");
  }

  function updateUI(freq) {
    var sig = freq === null ? "none" : (function () {
      var r = Math.round(freqToMidi(freq));
      var cents = Math.round(1200 * Math.log2(freq / midiToFreq(r)));
      return r + "|" + cents;
    })();
    if (sig === lastSig) return;
    lastSig = sig;

    var rows = els.strings.querySelectorAll(".srow");
    if (freq === null) {
      els.note.textContent = "—";
      els.note.className = "note";
      els.freq.textContent = "— Hz";
      els.cents.textContent = "—";
      els.cents.className = "cents";
      els.hint.textContent = "";
      rows.forEach(function (row) {
        row.classList.remove("active");
        row.querySelector(".marker").className = "marker";
        row.querySelector(".sdev").textContent = "";
      });
      return;
    }

    var midi = freqToMidi(freq);
    var r = Math.round(midi);
    var cents = Math.round(1200 * Math.log2(freq / midiToFreq(r)));
    var abs = Math.abs(cents);
    var cls = abs <= 5 ? "ok" : (abs <= 20 ? "close" : "off");

    els.note.textContent = noteName(midi);
    els.note.className = "note" + (abs <= 5 ? " ok" : "");
    els.freq.textContent = freq.toFixed(1) + " Hz";
    els.cents.textContent = (cents > 0 ? "+" : "") + cents + " ¢";
    els.cents.className = "cents " + cls;
    els.hint.textContent = abs <= 5 ? "juste !" : (cents > 0 ? "trop haut — détends" : "trop bas — tends");

    // nearest string of the selected instrument
    var tuning = TUNINGS[els.instrument.value];
    var best = null, bestDist = Infinity;
    tuning.forEach(function (s) {
      var d = Math.abs(s.midi - r);
      if (d < bestDist) { bestDist = d; best = s; }
    });
    var devVsTarget = Math.round(1200 * Math.log2(freq / midiToFreq(best.midi)));

    rows.forEach(function (row) {
      var m = parseInt(row.dataset.midi, 10);
      var marker = row.querySelector(".marker");
      var dev = row.querySelector(".sdev");
      if (m === best.midi) {
        row.classList.add("active");
        var pct = Math.max(0, Math.min(100, 50 + devVsTarget)); // ±50 ¢ -> 0..100 %
        marker.style.left = pct + "%";
        marker.className = "marker on " + (Math.abs(devVsTarget) <= 5 ? "ok" : (Math.abs(devVsTarget) <= 20 ? "close" : ""));
        dev.textContent = (devVsTarget > 0 ? "+" : "") + devVsTarget + " ¢";
      } else {
        row.classList.remove("active");
        marker.className = "marker";
        dev.textContent = "";
      }
    });
  }

  /* ---------- Mic loop with gate hysteresis + median smoothing ---------- */

  function loop() {
    if (!running) return;
    rafId = requestAnimationFrame(loop);
    analyser.getFloatTimeDomainData(scratch);
    var now = performance.now();
    var det = detectPitch(scratch, audioCtx.sampleRate);

    if (det && det.rms >= GATE_ON) lastSignalAt = now;
    var haveSignal = now - lastSignalAt <= HANG_MS;
    if (!haveSignal) {
      if (history.length) history = [];
      updateUI(null);
      return;
    }
    if (!det) return; // brief dropout inside the hang window: keep last state

    history.push(det.freq);
    if (history.length > SMOOTHING) history.shift();
    if (now - lastUiAt < UI_MS) return;
    lastUiAt = now;
    updateUI(median(history));
  }

  els.micBtn.addEventListener("click", function () {
    if (running) {
      running = false;
      cancelAnimationFrame(rafId);
      if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
      micStream = null;
      if (audioCtx) audioCtx.suspend();
      els.micBtn.textContent = "Démarrer le micro";
      els.micBtn.classList.remove("on");
      setStatus("micro arrêté");
      history = [];
      lastSig = null;
      updateUI(null);
      return;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { setStatus("Web Audio non supporté par ce navigateur", true); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("micro non disponible (HTTPS requis)", true);
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } })
      .then(function (stream) {
        if (!audioCtx) audioCtx = new AC();
        audioCtx.resume();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        scratch = new Float32Array(analyser.fftSize);
        var src = audioCtx.createMediaStreamSource(stream);
        src.connect(analyser);
        micStream = stream;
        running = true;
        lastSignalAt = performance.now();
        els.micBtn.textContent = "Arrêter le micro";
        els.micBtn.classList.add("on");
        setStatus("écoute en cours — jouez une corde");
        loop();
      })
      .catch(function () {
        setStatus("accès au micro refusé ou introuvable", true);
      });
  });

  /* ---------- Init ---------- */

  els.instrument.addEventListener("change", buildStrings);
  els.a4.addEventListener("change", buildStrings);
  buildStrings();
})();
</script>
</body>
</html>
