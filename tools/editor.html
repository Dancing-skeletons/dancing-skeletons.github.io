<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Éditeur de chansons</title>
<style>
  :root { font-family: system-ui, -apple-system, sans-serif; background:#f4f6fa; color:#22314a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:1rem; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; }
  .sub { font-size: .85rem; color:#6b7a93; margin:0 0 1rem; }

  .topbar {
    display:flex; flex-wrap:wrap; gap:.6rem; align-items:end;
    background:#fff; border:1px solid #e2e8f2; border-radius:10px; padding:.8rem;
    margin-bottom:1rem;
  }
  .field { display:flex; flex-direction:column; gap:.25rem; }
  .field label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#6b7a93; }
  .field input[type=text] { font-size:.95rem; padding:.35rem; border:1px solid #cdd7e5; border-radius:6px; background:#fff; width:180px; }
  button {
    font-size:.95rem; font-weight:700; border:none; border-radius:7px;
    padding:.5rem 1rem; cursor:pointer;
  }
  #dl-md { background:#00558d; color:#fff; }
  #dl-html { background:#0a7d33; color:#fff; }
  .ghost { background:#eef2f7; color:#2c4a6e; border:1px solid #cdd7e5; }
  #status { font-size:.8rem; color:#6b7a93; align-self:center; margin-left:auto; }

  .panes { display:grid; grid-template-columns: 1fr 1fr; gap:1rem; align-items:start; }
  .pane { background:#fff; border:1px solid #e2e8f2; border-radius:10px; padding:.8rem .9rem; }
  .pane > h2 { font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:#6b7a93; margin:0 0 .6rem; }
  #md {
    width:100%; min-height:65vh; resize:vertical;
    font-family: ui-monospace, Menlo, monospace; font-size:.92rem; line-height:1.5;
    border:1px solid #cdd7e5; border-radius:8px; padding:.6rem; background:#fbfcfe; color:#22314a;
  }
  #preview { width:100%; height:70vh; border:1px solid #cdd7e5; border-radius:8px; background:#fff; }
  .hint { font-size:.75rem; color:#6b7a93; margin:.5rem 0 0; }
  .hint code { font-family: ui-monospace, Menlo, monospace; background:#eef2f7; padding:0 .3em; border-radius:4px; }

  @media screen and (max-width: 900px) {
    .panes { grid-template-columns: 1fr; }
    #md { min-height: 40vh; }
    #preview { height: 60vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Éditeur de chansons</h1>
  <p class="sub">Écrivez en markdown à gauche, l'aperçu à droite ressemble à la page finale.
  Téléchargez le <code>.md</code></p>

  <div class="topbar">
    <div class="field">
      <label for="filename">Nom du fichier</label>
      <input type="text" id="filename" value="ma_chanson"/>
    </div>
    <button id="example-btn" class="ghost">Exemple</button>
    <button id="open-btn" class="ghost">Ouvrir un .md…</button>
    <input type="file" id="open-file" accept=".md" style="display:none"/>
    <button id="dl-md">Télécharger .md</button>
    <button id="dl-html">Télécharger .html</button>
    <button id="reset-btn" class="ghost">Réinitialiser</button>
    <span id="status"></span>
  </div>

  <div class="panes">
    <div class="pane">
      <h2>Markdown</h2>
      <textarea id="md" spellcheck="false"></textarea>
      <p class="hint">
        Ajoutez un accord en ligne avec <code>[C]</code>, sans parole avec <code>[[C F G]]</code>, diagramme avec
        <code>&lt;uke-chord name="C" frets="0003"&gt;&lt;/uke-chord&gt;</code>, refrain en
        <code>:::highlight … :::</code>.
      </p>
    </div>
    <div class="pane">
      <h2>Aperçu</h2>
      <iframe id="preview" title="Aperçu de la chanson"></iframe>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markdown-it-container/dist/markdown-it-container.min.js"></script>
<script>
window.siteCSS = ":root {\n    --font-scale: 1;\n}\n\nbody {\n  font-family: \"Josefin Sans\", \"Ubuntu\", system-ui, Arial, sans-serif;\n  padding: 1rem;\n  line-height: 2.1;\n  letter-spacing: 0.1px;\n  font-size: calc(1em * var(--font-scale));\n}\n\n/* Code blocks */\ncode {\n  font-family: monospace;\n  white-space: pre;\n  font-size: 1.4em;\n  line-height: 1.4em;\n}\n\n/* Column layouts */\n#content.two-column {\n  column-count: 2;\n  column-gap: 2em;\n}\n\n#content.one-column {\n  column-count: 1;\n}\n\n#content.three-column {\n  column-count: 3;\n  column-gap: 2em;\n}\n\n/* Small screens (phones): force a single readable column */\n@media screen and (max-width: 700px) {\n  #content.two-column,\n  #content.three-column {\n    column-count: 1;\n  }\n  body {\n    padding: 0.5rem;\n  }\n}\n\n\n/* -------------------------------------------------\n   CHORDS\n   - .chord          : floating chord written inline in lyrics via [C]\n   - .chord-static    : chord badge written directly in the text via [[C]]\n   ------------------------------------------------- */\n\n/* Floating chord: zero-width box so it never pushes the lyric text that\n   follows it, painted above the line via a negative \"top\" offset. */\n.chord {\n  position: relative;\n  display: inline-block;\n  width: 0;              /* no horizontal footprint in the flow */\n  overflow: visible;       /* but the chord text still paints, outside the box */\n  top: -1.1em;\n  color: #4C6B8B;\n  font-weight: 600;\n  font-size: 0.85em;\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n  white-space: nowrap;\n  text-align: left;\n  line-height: 1;\n}\n\n/* Static chord badge (e.g. intro/instrumental lines, or instructions).\n   Sits in normal flow with real spacing, like a small pill. */\n.chord.chord-static {\n  position: relative;      /* needed for the \"top\" nudge below */\n  top: 0.12em;              /* small nudge to align chord text with lyric baseline\n                                (monospace vs. Josefin Sans have slightly different\n                                internal baselines) — tweak in ~0.02em steps if needed */\n  display: inline-block;\n  width: auto;\n  overflow: visible;\n  vertical-align: baseline;\n  margin-right: 0.0em;\n  padding: 1px 6px;\n  border-radius: 4px;\n  background: #eef2f7;\n  color: #2c4a6e;\n  font-size: 1em;\n  font-weight: 600;\n  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n}\n\n/* Chord diagrams (uke-chord web components). Size is controlled live via\n   the \"size\" attribute (see the slider script in md_renderer.js) rather\n   than CSS, so this just adds a little breathing room. */\n.chord-diagram {\n  margin: 0.2em 0.4em 0.2em 0;\n  vertical-align: top;\n}\n\n\n/* Tableau */\n.tableau-group {\n  display: inline-block;\n  vertical-align: top;\n  max-width: 100%;\n  margin-right: 1em;\n}\n\npre.tableau {\n  font-family: monospace;\n  white-space: pre;\n  font-size: 1em;\n  line-height: 1em;\n  margin: 0;\n  overflow-x: auto;\n}\n\n/* Superscripts */\n.big-sup {\n  position: absolute;\n  transform: translateY(-1em);\n  font-size: 1.2em;\n  color: blue;\n}\n\n\n/* Highlight box */\n.highlight {\n  background-color: #d3d3d3;\n  border: 2px solid #d3d3d3;\n  border-radius: 5px;\n  margin: -5px;\n  -webkit-print-color-adjust: exact;\n  print-color-adjust: exact;\n  color-adjust: exact;\n}\n\n.highlight h3,\n.highlight p {\n  margin-top: 0;\n  margin-bottom: 0;\n  margin-left: 5px;\n  margin-right: 5px;\n}\n\n.highlight .big-sup {\n  color: #000080;\n}\n\n.highlight .chord-static {\n  background: #c9d3de;\n  color: #0b0b8b;\n}\n\n\n/* Staff */\n.staff {\n  display: grid;\n  grid-template-rows: repeat(4, 30px);\n  grid-auto-flow: column;\n  gap: 10px;\n}\n\n.staff div {\n  border-bottom: 2px solid black;\n  text-align: center;\n  line-height: 30px;\n  font-weight: bold;\n}\n\n/* OSMD */\n.osmd-block {\n  margin: 1.5em 0;\n  border: 1px solid #ddd;\n  padding: 0.5em;\n  border-radius: 8px;\n  background: #fafafa;\n}\n\n.verovio-block svg {\n  max-width: 100%;\n  height: auto;\n  margin: 1.5em 0;\n  border: 1px solid #ddd;\n  padding: 0.5em;\n  border-radius: 8px;\n  background: #fafafa;\n}\n\n\n/* -------------------------------------------------\n   CONTROLS PANEL\n   ------------------------------------------------- */\n\n#controls-handle {\n  position: fixed;\n  top: 10px;\n  right: 10px;\n  z-index: 10000;\n  width: 44px;\n  height: 44px;\n  border-radius: 50%;\n  border: none;\n  background: #007acc;\n  color: #fff;\n  font-size: 1.3rem;\n  cursor: pointer;\n}\n\n#controls-container {\n  position: fixed;\n  top: 64px;\n  right: 10px;\n  z-index: 9999;\n  width: 180px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  transition: transform .2s ease, opacity .2s ease;\n}\n\n#controls-container.collapsed {\n  transform: translateX(140%);\n  opacity: 0;\n  pointer-events: none;\n}\n\n#controls-container {\n  font-size: 1.2rem;\n  text-align: center;\n  font-weight: bold;\n}\n\n#toggle-columns {\n  font-size: 1.2rem;\n  font-weight: bold;\n  padding: 8px 12px;\n  background: #007acc;\n  color: #fff;\n  border: none;\n  border-radius: 6px;\n  cursor: pointer;\n  width: 100%;\n  text-align: center;\n}\n\n.control-group {\n  background: #007acc;\n  color: #fff;\n  border-radius: 6px;\n  padding: 8px 10px;\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n\n.control-checkbox {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  font-weight: bold;\n  font-size: 1rem;\n  cursor: pointer;\n}\n\n.control-checkbox input[type=\"checkbox\"] {\n  width: 18px;\n  height: 18px;\n  cursor: pointer;\n}\n\n.control-group input[type=\"range\"] {\n  width: 100%;\n  cursor: pointer;\n}\n\n#transpose-controls {\n  display: flex;\n  width: 100%;\n}\n\n#transpose-controls button,\n#transpose-controls span {\n  font-size: 1.5rem;\n  font-weight: bold;\n  background: #007acc;\n  color: #fff;\n  border: none;\n  padding: 8px 0;\n  text-align: center;\n  height: 48px;\n}\n\n#transpose-controls button {\n  cursor: pointer;\n  margin: 0;\n}\n\n#transpose-down {\n  width: 60px;\n  border-radius: 6px 0 0 6px;\n}\n\n#transpose-level {\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  background: #007acc;\n  color: white;\n  font-size: 1.2rem;\n  font-weight: bold;\n}\n\n#transpose-up {\n  width: 60px;\n  border-radius: 0 6px 6px 0;\n}\n\n\n/* Print rules */\n@media print {\n  h1 {\n    font-size: calc(1.5em * var(--font-scale));\n    text-decoration-line: underline;\n  }\n\n\n  #content.two-column {\n    column-count: 2;\n    column-gap: 2em;\n  }\n\n  #content.one-column {\n    column-count: 1 !important;\n  }\n\n  #content.three-column {\n    column-count: 3;\n    column-gap: 2em;\n  }\n\n  #controls-handle,\n  #controls-container {\n    display: none;\n  }\n\n  .verovio-block svg {\n    width: 100% !important;\n    height: auto !important;\n    max-width: 100% !important;\n    page-break-inside: avoid;\n    transform-origin: 0 0 !important;\n  }\n\n  .verovio-block {\n    width: 100%;\n    max-width: 100%;\n    margin: 0;\n    padding: 0;\n    break-inside: avoid;\n\n  }\n\n  .chord-static {\n    background: #eee !important;\n    color: #000 !important;\n    -webkit-print-color-adjust: exact;\n    print-color-adjust: exact;\n  }\n}\n\n/* Strudel */\n  #generator {\n    max-width: 500px;\n    margin: 0 auto 1.5rem;\n  }\n  #generator h1 {\n    font-size: 1.4rem;\n  }\n  .field {\n    margin-bottom: 1rem;\n  }\n  .field label {\n    display: block;\n    font-weight: bold;\n    margin-bottom: 0.3rem;\n  }\n  .field select,\n  .field input[type=\"range\"] {\n    width: 100%;\n    font-size: 1rem;\n    padding: 0.3rem;\n  }\n  .tempo-value {\n    font-weight: bold;\n  }\n  .transport {\n    display: flex;\n    gap: 0.6rem;\n  }\n  .transport button {\n    flex: 1;\n    font-size: 1.2rem;\n    font-weight: bold;\n    padding: 0.6rem 1.2rem;\n    border: none;\n    border-radius: 6px;\n    cursor: pointer;\n  }\n  #play-btn {\n    background: #007acc;\n    color: #fff;\n  }\n  #stop-btn {\n    background: #c0392b;\n    color: #fff;\n  }\n  #status {\n    max-width: 700px;\n    margin: 0.5rem auto 0;\n    font-size: 0.85rem;\n    color: #c0392b;\n    min-height: 1.2em;\n  }\n\n  /* Full chord grid, always visible, no scrolling needed */\n  #chord-grid {\n    max-width: 700px;\n    margin: 1.2rem auto 1.5rem;\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));\n    gap: 0.6rem;\n  }\n  .chord-chip {\n    padding: 0.6rem 0.4rem;\n    border-radius: 6px;\n    border: 3px solid transparent;\n    background: #eef2f7;\n    color: #2c4a6e;\n    font-weight: 600;\n    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;\n    font-size: 1.1rem;\n    text-align: center;\n    transition: border-color 0.15s ease, background 0.15s ease;\n  }\n  .chord-chip.current {\n    border-color: #00558d;\n    background: #dbeaf7;\n  }\n  .chord-chip.next {\n    border-color: #b7d8f0;\n  }\n\n  strudel-editor {\n    display: none;\n    max-width: 200px;\n    margin: 0 auto;\n    min-height: 200px;\n  }";
</script>
<script src="../md_renderer.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  "use strict";

  var EXAMPLE = [
    "# Ma chanson - Interprète",
    "",
    "## Accords:",
    '<uke-chord name="C" frets="0003"></uke-chord>',
    '<uke-chord name="F" frets="2010"></uke-chord>',
    '<uke-chord name="G" frets="0232"></uke-chord>',
    "",
    "## Instructions:",
    "- Intro: chaque accord dure 4 temps, joué en ▼ ▲▼ ▼ .",
    "",
    "## Paroles:",
    "",
    "### Intro",
    "",
    "[[C G Am F]]",
    "",
    "### Couplet",
    "Lalala [C] ceci",
    "est une chanson [G]",
    "et un cou[F]plet.",
    "",
    ":::highlight",
    "### Refrain",
    "Ceci est [G] un refrain [C]!",
    ":::",
    ""
  ].join("\n");

  var ta = document.getElementById("md");
  var frame = document.getElementById("preview");
  var fname = document.getElementById("filename");
  var status = document.getElementById("status");
  var timer = null;

  function name() { return (fname.value.trim() || "ma_chanson").replace(/\.(md|html)$/i, ""); }

  function render() {
    try {
      frame.srcdoc = window.renderSong(ta.value, name());
      status.textContent = "aperçu mis à jour";
      localStorage.setItem("editorDraft", ta.value);
      localStorage.setItem("editorName", fname.value);
    } catch (err) {
      status.textContent = "erreur: " + err.message;
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(render, 350);
  }

  function download(fileName, content, type) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([content], { type: type }));
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  ta.addEventListener("input", schedule);
  fname.addEventListener("input", schedule);

  document.getElementById("example-btn").addEventListener("click", function () {
    ta.value = EXAMPLE; render();
  });
  document.getElementById("reset-btn").addEventListener("click", function () {
    localStorage.removeItem("editorDraft");
    localStorage.removeItem("editorName");
    ta.value = EXAMPLE; fname.value = "ma_chanson"; render();
  });
  document.getElementById("open-btn").addEventListener("click", function () {
    document.getElementById("open-file").click();
  });
  document.getElementById("open-file").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    file.text().then(function (text) {
      ta.value = text;
      fname.value = file.name.replace(/\.md$/i, "");
      render();
    });
  });
  document.getElementById("dl-md").addEventListener("click", function () {
    download(name() + ".md", ta.value, "text/markdown");
  });
  document.getElementById("dl-html").addEventListener("click", function () {
    try {
      download(name() + ".html", window.renderSong(ta.value, name()), "text/html");
    } catch (err) {
      status.textContent = "erreur: " + err.message;
    }
  });

  var draft = localStorage.getItem("editorDraft");
  ta.value = draft !== null ? draft : EXAMPLE;
  fname.value = localStorage.getItem("editorName") || "ma_chanson";
  render();
});
</script>
</body>
</html>
